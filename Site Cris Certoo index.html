<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cris Prado | Hot Dog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        h1 { font-family: 'Bangers', cursive; }
        .slogan { font-family: 'Pacifico', cursive; }
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: #f9fafb;
            /* FUNDO MINIMALISTA */
            background-image: url("https://www.transparenttextures.com/patterns/food.png");
            background-attachment: fixed;
        }
        .sidebar { transition: 0.3s; transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-32">

    <div id="sidebar" class="sidebar fixed inset-y-0 left-0 w-72 bg-white shadow-2xl z-[60] p-6">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-red-600">Menu</h2>
            <button onclick="toggleSidebar()" class="text-3xl">&times;</button>
        </div>
        
        <div class="space-y-6">
            <div>
                <h3 class="font-black text-gray-800 mb-2">📍 MEUS PEDIDOS</h3>
                <input type="number" id="track-phone" placeholder="Seu WhatsApp (só números)" class="w-full p-2 border rounded-lg text-sm mb-2">
                <button onclick="buscarStatus()" class="w-full bg-red-500 text-white py-2 rounded-lg font-bold text-sm">Consultar Status</button>
            </div>
            <div id="status-result" class="text-sm space-y-2 max-h-64 overflow-y-auto pt-4 border-t">
                <p class="text-gray-400 italic">Insira seu número para rastrear...</p>
            </div>
        </div>
    </div>
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-[55] hidden"></div>

    <header class="bg-red-600 text-white p-6 text-center shadow-xl border-b-4 border-yellow-400 relative">
        <button onclick="toggleSidebar()" class="absolute left-4 top-1/2 -translate-y-1/2 text-3xl">☰</button>
        <h1 class="text-5xl mb-1 italic text-yellow-100">Cris Prado</h1>
        <p class="slogan text-lg text-yellow-200">O melhor hot dog da região!</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-8">
        <section>
            <h2 class="text-2xl font-bold mb-4 text-red-700 border-b-2 border-red-200">🌭 Cachorro Quente</h2>
            <div class="space-y-3" id="lista-dogs">
                </div>
        </section>

        <section>
            <h2 class="text-2xl font-bold mb-4 text-red-700 border-b-2 border-red-200">🥤 Bebidas</h2>
            <div class="space-y-3" id="lista-bebidas">
                </div>
        </section>
    </main>

    <div id="modal-mayo" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-[70]">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
            <h3 id="modal-item-name" class="text-2xl font-black mb-4 text-red-600 italic">OPÇÕES</h3>
            <p class="font-bold mb-3">Deseja Maionese?</p>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="setMayo(false)" class="p-3 border-2 rounded-2xl font-bold">❌ NÃO</button>
                <button onclick="setMayo(true)" class="p-3 border-2 rounded-2xl font-bold bg-green-50 border-green-500">✅ SIM</button>
            </div>
            <div id="mayo-flavors" class="hidden mb-6">
                <select id="mayo-select" class="w-full p-4 border-2 border-yellow-400 rounded-xl font-bold">
                    <option value="Maionese Verde">Maionese Verde</option>
                    <option value="Maionese de Bacon">Maionese de Bacon</option>
                    <option value="Cebola Caramelizada">Cebola Caramelizada</option>
                </select>
            </div>
            <button onclick="confirmLanche()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold text-xl">Confirmar</button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-between items-center shadow-2xl z-40">
        <div><p class="text-xs text-gray-400 font-bold uppercase">Total do Pedido</p><span class="text-3xl font-black text-red-600">R$ <span id="total-price">0,00</span></span></div>
        <button onclick="toggleCartModal()" class="bg-red-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg">Ver Carrinho</button>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 max-h-[90vh] overflow-y-auto relative">
            <button onclick="toggleCartModal()" class="absolute right-4 top-4 text-2xl">✕</button>
            <h2 class="text-2xl font-bold mb-4">Finalizar Pedido</h2>
            <div id="cart-items" class="space-y-2 mb-6 border-b pb-4"></div>
            <div class="space-y-3">
                <input type="text" id="client-name" placeholder="Seu Nome" class="w-full p-3 border-2 rounded-xl">
                <input type="number" id="client-phone" placeholder="WhatsApp (DDD + Número)" class="w-full p-3 border-2 rounded-xl border-blue-200">
                <input type="text" id="address" placeholder="Endereço Completo" class="w-full p-3 border-2 rounded-xl">
                <input type="text" id="obs" placeholder="Ponto de Referência" class="w-full p-3 border-2 rounded-xl bg-gray-50">
                <select id="payment" class="w-full p-3 border-2 rounded-xl font-bold bg-yellow-50">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão (Maquininha)</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
            <button id="btn-finalizar" onclick="finalizarPedido()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-black text-xl mt-6">ENVIAR PEDIDO 📲</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFqUjWp4fBd_wl75uMmaGjRfJDS85FLe4",
            authDomain: "cris-prado.firebaseapp.com",
            projectId: "cris-prado",
            storageBucket: "cris-prado.firebasestorage.app",
            messagingSenderId: "316187175890",
            appId: "1:316187175890:web:72288256711dfad37fb60b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // CONFIGURAÇÕES GERAIS
        window.cart = [];
        window.total = 0;
        let tempItem = null;
        let hasMayo = false;

        const dogs = [
            { n: 'Carne', p: 14.90 }, { n: 'Frango', p: 14.90 }, { n: 'Misto', p: 14.90 }
        ];
        const bebidinhas = [
            { n: 'Coca-Cola Lata', p: 6.00 }, { n: 'Coca-Cola 2L', p: 15.00 },
            { n: 'Roller 2L', p: 10.00 }, { n: 'Cotuba 2L', p: 12.00 }
        ];

        // RENDERIZAÇÃO
        const render = () => {
            document.getElementById('lista-dogs').innerHTML = dogs.map(d => `
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-red-500 flex justify-between items-center">
                    <div><h3 class="font-bold">${d.n}</h3><span class="text-green-600 font-bold">R$ ${d.p.toFixed(2)}</span></div>
                    <button onclick="openCustomization('${d.n}', ${d.p})" class="bg-red-500 text-white w-12 h-12 rounded-xl font-bold text-2xl">+</button>
                </div>
            `).join('');

            document.getElementById('lista-bebidas').innerHTML = bebidinhas.map(b => `
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 flex justify-between items-center">
                    <div><h3 class="font-bold">${b.n}</h3><span class="text-green-600 font-bold">R$ ${b.p.toFixed(2)}</span></div>
                    <div class="flex items-center gap-3 bg-gray-100 p-1 rounded-lg">
                        <button onclick="changeQty('${b.n}', ${b.p}, -1)" class="bg-white w-8 h-8 rounded shadow text-red-600 font-bold">-</button>
                        <span id="qty-${b.n}" class="font-bold">0</span>
                        <button onclick="changeQty('${b.n}', ${b.p}, 1)" class="bg-white w-8 h-8 rounded shadow text-green-600 font-bold">+</button>
                    </div>
                </div>
            `).join('');
        };
        render();

        // FUNÇÕES SIDEBAR
        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('hidden');
        };

        window.buscarStatus = async () => {
            const tel = document.getElementById('track-phone').value;
            const res = document.getElementById('status-result');
            if(!tel) return alert("Digite seu número!");
            
            res.innerHTML = "Buscando...";
            const q = query(collection(db, "pedidos"), where("telefone", "==", tel), orderBy("data", "desc"));
            const snap = await getDocs(q);
            
            if(snap.empty) { res.innerHTML = "Nenhum pedido encontrado."; return; }
            
            res.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                const cor = p.status === 'pendente' ? 'text-yellow-600' : p.status === 'preparando' ? 'text-blue-600' : 'text-green-600';
                res.innerHTML += `
                    <div class="bg-gray-50 p-2 rounded border">
                        <div class="flex justify-between"><b>Pedido #${doc.id.slice(-4)}</b> <span class="${cor} font-black uppercase text-[10px]">${p.status}</span></div>
                        <p class="text-[10px] text-gray-500">${p.itens.length} itens - Total R$ ${p.total.toFixed(2)}</p>
                    </div>
                `;
            });
        };

        // LÓGICA CARRINHO
        window.openCustomization = (name, price) => {
            tempItem = { name, price };
            document.getElementById('modal-item-name').innerText = name;
            document.getElementById('modal-mayo').classList.remove('hidden');
        };
        window.setMayo = (val) => {
            hasMayo = val;
            document.getElementById('mayo-flavors').classList.toggle('hidden', !val);
        };
        window.confirmLanche = () => {
            const sabor = hasMayo ? document.getElementById('mayo-select').value : 'Sem Maionese';
            window.cart.push({ name: `${tempItem.name} (${sabor})`, price: tempItem.price });
            window.total += tempItem.price;
            updateDisplay();
            document.getElementById('modal-mayo').classList.add('hidden');
        };
        window.changeQty = (name, price, delta) => {
            const qtySpan = document.getElementById(`qty-${name}`);
            let newQty = Math.max(0, parseInt(qtySpan.innerText) + delta);
            if(newQty !== parseInt(qtySpan.innerText)) {
                qtySpan.innerText = newQty;
                window.total += (delta * price);
                if(delta > 0) window.cart.push({name, price});
                else { const idx = window.cart.findLastIndex(i => i.name === name); if(idx > -1) window.cart.splice(idx, 1); }
                updateDisplay();
            }
        };
        function updateDisplay() {
            document.getElementById('total-price').innerText = window.total.toFixed(2).replace('.', ',');
            document.getElementById('cart-items').innerHTML = window.cart.map(i => `<div class="flex justify-between text-sm"><span>${i.name}</span><b>R$ ${i.price.toFixed(2)}</b></div>`).join('');
        }
        window.toggleCartModal = () => document.getElementById('cart-modal').classList.toggle('hidden');

        window.finalizarPedido = async () => {
            const nome = document.getElementById('client-name').value;
            const tel = document.getElementById('client-phone').value;
            const end = document.getElementById('address').value;
            if(!nome || !tel || !end || window.cart.length === 0) return alert("Preencha tudo e adicione itens!");

            try {
                await addDoc(collection(db, "pedidos"), {
                    cliente: nome, telefone: tel, endereco: end,
                    itens: window.cart, total: window.total,
                    pagamento: document.getElementById('payment').value,
                    status: "pendente", data: serverTimestamp()
                });
                let msg = `*NOVO PEDIDO - CRIS PRADO*%0A👤 *Cliente:* ${nome}%0A📱 *Tel:* ${tel}%0A📍 *End:* ${end}%0A💰 *TOTAL: R$ ${window.total.toFixed(2)}*`;
                window.open(`https://wa.me/5511999999999?text=${msg}`);
                location.reload();
            } catch (e) { alert("Erro ao enviar!"); }
        };
    </script>
</body>
</html>
