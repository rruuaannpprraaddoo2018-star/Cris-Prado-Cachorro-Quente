<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cris Prado | Hot Dog Premium</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1046/1046774.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Pacifico&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        h1 { font-family: 'Bangers', cursive; }
        .slogan { font-family: 'Pacifico', cursive; }
        body { font-family: 'Roboto', sans-serif; transition: 0.3s; -webkit-tap-highlight-color: transparent; }
        
        /* Dark Mode IA Style */
        @media (prefers-color-scheme: dark) {
            body { background-color: #0f0f0f; color: #f3f4f6; }
            .bg-white { background-color: #1a1a1a !important; color: #fff !important; }
            .text-gray-600 { color: #9ca3af !important; }
            .border-gray-200 { border-color: #333 !important; }
            .bg-gray-100 { background-color: #2a2a2a !important; } /* Para os controles de quantidade */
            input, select { background-color: #2a2a2a !important; border-color: #444 !important; color: #f3f4f6 !important;}
        }

        .modal-animate { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .product-img { width: 80px; height: 80px; object-fit: contain; }
    </style>
</head>
<body class="bg-gray-50 pb-32">

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-full shadow-2xl z-[100] hidden font-bold"></div>

    <header class="bg-red-600 text-white p-10 text-center shadow-2xl border-b-4 border-yellow-400 relative">
        <h1 class="text-6xl mb-2 italic text-yellow-100 drop-shadow-md">Cris Prado</h1>
        <p class="slogan text-2xl text-yellow-200">O melhor hot dog da região!</p>
        <div id="status-loja" class="mt-4 inline-flex items-center gap-2 bg-black/30 backdrop-blur-md px-5 py-2 rounded-full font-bold text-sm">
            <span id="status-dot" class="w-3 h-3 rounded-full"></span>
            <span id="status-text">Carregando...</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-10">
        
        <section data-aos="fade-right">
            <h2 class="text-2xl font-black mb-6 text-red-700 border-b-4 border-red-100 pb-2">🌭 Nossos Dogs</h2>
            <div class="space-y-4" id="lista-dogs">
                </div>
        </section>

        <section data-aos="fade-left">
            <h2 class="text-2xl font-black mb-6 text-blue-700 border-b-4 border-blue-100 pb-2">🥤 Bebidas Geladas</h2>
            <div class="space-y-4" id="lista-bebidas">
                </div>
        </section>

        <section data-aos="zoom-in" class="bg-zinc-900 text-white p-8 rounded-[40px] text-center shadow-2xl">
            <p class="text-yellow-400 font-black uppercase tracking-widest text-xs mb-2 text-center">Onde estamos</p>
            <p class="font-bold text-lg mb-4">Rua Francisco Meneghetti, 41<br>Tanabi - SP</p>
            <a href="https://www.google.com/maps/search/?api=1&query=Rua+Francisco+Meneghetti,+41,+Tanabi,+SP" target="_blank" class="inline-block bg-white text-black px-8 py-3 rounded-full font-black text-sm uppercase">Abrir no Maps 📍</a>
        </section>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white dark:bg-zinc-900 p-6 flex justify-between items-center shadow-[0_-10px_30px_rgba(0,0,0,0.15)] z-50 rounded-t-[32px]">
        <div>
            <p class="text-[10px] font-black text-gray-400 uppercase">Seu Total</p>
            <span class="text-3xl font-black text-red-600">R$ <span id="total-price">0,00</span></span>
        </div>
        <button onclick="toggleCartModal()" class="bg-red-600 text-white px-10 py-4 rounded-2xl font-black text-lg shadow-lg shadow-red-500/30 active:scale-95 transition">Carrinho 🛒</button>
    </div>

    <div id="modal-mayo" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center z-[60]">
        <div class="bg-white w-full max-w-md p-8 rounded-t-[40px] sm:rounded-[40px] modal-animate relative">
            <button onclick="closeModals()" class="absolute top-6 right-6 text-gray-400 text-2xl font-bold">✕</button>
            <h3 id="modal-item-name" class="text-3xl font-black text-red-600 mb-6 italic">Personalizar</h3>
            <p class="font-bold text-lg mb-4">Escolha sua Maionese Especial:</p>
            <div class="space-y-3 mb-8">
                <select id="mayo-select" class="w-full p-5 border-2 border-gray-200 rounded-2xl font-bold appearance-none bg-gray-50 dark:bg-zinc-800">
                    <option value="Maionese Verde">Maionese Verde (Casa)</option>
                    <option value="Maionese de Bacon">Maionese de Bacon</option>
                    <option value="Cebola Caramelizada">Cebola Caramelizada</option>
                    <option value="Sem Maionese">Sem Maionese</option>
                </select>
            </div>
            <button onclick="confirmLanche()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-black text-xl shadow-xl active:scale-95 transition">Confirmar no Carrinho</button>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center z-[60]">
        <div class="bg-white w-full max-w-md p-8 rounded-t-[40px] sm:rounded-[40px] max-h-[95vh] overflow-y-auto modal-animate relative">
            <button onclick="closeModals()" class="absolute top-6 right-6 text-gray-400 text-2xl font-bold">✕</button>
            <h2 class="text-3xl font-black mb-6">Seu Pedido</h2>
            
            <div class="flex gap-2 p-1 bg-gray-100 dark:bg-zinc-800 rounded-2xl mb-6">
                <button id="btn-entrega" onclick="setMethod('entrega')" class="flex-1 py-3 rounded-xl font-black text-sm bg-white shadow dark:bg-zinc-700">🛵 ENTREGA</button>
                <button id="btn-retirada" onclick="setMethod('retirada')" class="flex-1 py-3 rounded-xl font-black text-sm">🏠 RETIRADA</button>
            </div>

            <div id="cart-items" class="space-y-4 mb-8 border-b border-gray-100 pb-6"></div>

            <div class="space-y-4" id="form-fields">
                <input type="text" id="client-name" placeholder="Seu Nome" class="w-full p-4 border-2 rounded-2xl font-bold dark:bg-zinc-800">
                <div id="address-fields">
                    <input type="text" id="address" placeholder="Endereço Completo" class="w-full p-4 border-2 rounded-2xl font-bold mb-4 dark:bg-zinc-800">
                    <input type="text" id="obs" placeholder="Ponto de Referência" class="w-full p-4 border-2 rounded-2xl font-bold bg-blue-50 dark:bg-zinc-800">
                </div>
                <select id="payment" class="w-full p-4 border-2 rounded-2xl font-bold dark:bg-zinc-800">
                    <option value="Pix">💳 Pix</option>
                    <option value="Cartão">📟 Cartão (Maquininha)</option>
                    <option value="Dinheiro">💵 Dinheiro</option>
                </select>
            </div>

            <button id="btn-finalizar" onclick="finalizarPedido()" class="w-full bg-green-500 text-white py-5 rounded-2xl font-black text-xl mt-8 shadow-2xl active:scale-95 transition">ENVIAR PEDIDO 📲</button>
            <button onclick="closeModals()" class="w-full text-gray-400 font-bold mt-4">Adicionar mais itens</button>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURAÇÃO FIREBASE (Mantenha a sua aqui)
        const firebaseConfig = {
            apiKey: "AIzaSyCFqUjWp4fBd_wl75uMmaGjRfJDS85FLe4",
            authDomain: "cris-prado.firebaseapp.com",
            projectId: "cris-prado",
            storageBucket: "cris-prado.firebasestorage.app",
            messagingSenderId: "316187175890",
            appId: "1:316187175890:web:72288256711dfad37fb60b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // VARIÁVEIS GLOBAIS
        window.cart = [];
        window.total = 0;
        let tempItem = null;
        let orderMethod = 'entrega'; // Default para entrega

        const hotDogs = [
            { id: 'dog-carne', nome: "Carne", preco: 14.90 },
            { id: 'dog-frango', nome: "Frango", preco: 14.90 },
            { id: 'dog-misto', nome: "Misto", preco: 14.90 }
        ];

        const bebidas = [
            { id: 'coca-zero-lata', nome: "Coca-Cola lata zero", preco: 6.00, img: "https://im.ge/i/cocazero-lata.png" },
            { id: 'coca-lata-350', nome: "Coca lata 350ml", preco: 6.00, img: "https://im.ge/i/coca-lata.png" },
            { id: 'coca-litro', nome: "Coca-Cola 1 Litro (Desc.)", preco: 9.00, img: "https://im.ge/i/coca-litro.png" },
            { id: 'coca-600ml', nome: "Coca 600ml", preco: 8.00, img: "https://im.ge/i/coca-600ml.png" },
            { id: 'cotuba-600ml', nome: "Cotuba 600ml", preco: 7.00, img: "https://im.ge/i/cotuba-600ml.png" },
            { id: 'coca-200ml', nome: "Coca 200ml", preco: 4.00, img: "https://im.ge/i/coca-200ml.png" },
            { id: 'roller-200ml', nome: "Roller 200ml", preco: 3.50, img: "https://im.ge/i/roller-200ml.png" },
            { id: 'agua-gas-500ml', nome: "Água com gás 500ml", preco: 5.00, img: "https://im.ge/i/agua-gas.png" },
            { id: 'agua-sem-gas-500ml', nome: "Água sem gás 500ml", preco: 4.00, img: "https://im.ge/i/agua-sem-gas.png" },
            { id: 'suco-laranja-500ml', nome: "Suco Laranja 500ml", preco: 10.00, img: "https://im.ge/i/suco-laranja.png" }
        ];

        // INICIALIZAÇÃO
        window.onload = () => {
            AOS.init({ duration: 800, once: true });
            renderHotDogs();
            renderBebidas();
            checkStatus();
            setInterval(checkStatus, 60000);
            setMethod(orderMethod); // Garante que o formulário comece no modo padrão (entrega)
        };

        function renderHotDogs() {
            const container = document.getElementById('lista-dogs');
            container.innerHTML = hotDogs.map(dog => `
                <div class="bg-white p-4 rounded-3xl shadow-md flex justify-between items-center border border-gray-100">
                    <div class="flex-1">
                        <h3 class="font-black text-xl">${dog.nome}</h3>
                        <p class="text-green-600 font-black text-lg">R$ ${dog.preco.toFixed(2).replace('.', ',')}</p>
                    </div>
                    <div class="flex items-center gap-4 bg-gray-100 dark:bg-zinc-800 p-2 rounded-2xl">
                        <button onclick="changeQty('${dog.nome}', ${dog.preco}, -1)" class="w-10 h-10 bg-white dark:bg-zinc-700 rounded-xl shadow font-bold text-red-500 text-2xl">-</button>
                        <span id="qty-${dog.nome}" class="font-black text-xl">0</span>
                        <button onclick="openCustomization('${dog.nome}', ${dog.preco})" class="w-10 h-10 bg-red-600 text-white rounded-xl shadow font-bold text-2xl">+</button>
                    </div>
                </div>
            `).join('');
        }

        function renderBebidas() {
            const container = document.getElementById('lista-bebidas');
            container.innerHTML = bebidas.map(b => `
                <div class="bg-white p-4 rounded-3xl shadow-md flex justify-between items-center border border-gray-100 overflow-hidden">
                    <div class="flex-1">
                        <h3 class="font-black text-lg leading-tight">${b.nome}</h3>
                        <p class="text-green-600 font-black text-xl mt-1">R$ ${b.preco.toFixed(2).replace('.', ',')}</p>
                        <div class="flex items-center gap-3 bg-gray-100 dark:bg-zinc-800 p-1 w-fit rounded-xl mt-3">
                            <button onclick="changeQty('${b.nome}', ${b.preco}, -1)" class="w-8 h-8 bg-white dark:bg-zinc-700 rounded shadow font-bold text-red-500">-</button>
                            <span id="qty-${b.nome}" class="font-bold w-4 text-center">0</span>
                            <button onclick="changeQty('${b.nome}', ${b.preco}, 1)" class="w-8 h-8 bg-white dark:bg-zinc-700 rounded shadow font-bold text-green-600">+</button>
                        </div>
                    </div>
                    <img src="${b.img}" class="product-img ml-4" alt="${b.nome}">
                </div>
            `).join('');
        }

        // FUNÇÕES DE LÓGICA
        window.checkStatus = () => {
            const agora = new Date();
            const dia = agora.getDay(); // 0: Dom, 2: Ter, 6: Sáb
            const hora = agora.getHours();
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const btnFinalizar = document.getElementById('btn-finalizar');

            const isAberto = (dia >= 2 && dia <= 6) && (hora >= 18 && hora < 23);

            statusDot.className = `w-3 h-3 rounded-full ${isAberto ? 'bg-green-400 animate-pulse' : 'bg-red-500'}`;
            statusText.innerText = isAberto ? "ABERTO AGORA" : "FECHADO (Abre Ter-Sáb as 18h)";
            
            if (btnFinalizar) {
                btnFinalizar.disabled = !isAberto;
                btnFinalizar.innerText = !isAberto ? "FECHADO NO MOMENTO 😔" : "ENVIAR PEDIDO 📲";
                btnFinalizar.classList.toggle('bg-gray-400', !isAberto);
                btnFinalizar.classList.toggle('bg-green-500', isAberto);
            }
        };

        window.openCustomization = (name, price) => {
            tempItem = { name, price };
            document.getElementById('modal-item-name').innerText = name;
            document.getElementById('modal-mayo').classList.remove('hidden');
        };

        window.confirmLanche = () => {
            const mayo = document.getElementById('mayo-select').value;
            const fullItemName = `${tempItem.name} (${mayo})`;
            const newId = Date.now();
            window.cart.push({ id: newId, name: fullItemName, baseName: tempItem.name, price: tempItem.price });
            window.total += tempItem.price;
            
            // Atualiza contador no cardápio
            const qtySpan = document.getElementById(`qty-${tempItem.name}`);
            if(qtySpan) qtySpan.innerText = parseInt(qtySpan.innerText) + 1;
            
            updateDisplay();
            showToast("🌭 Adicionado!");
            closeModals();
        };

        window.changeQty = (name, price, delta) => {
            const qtySpan = document.getElementById(`qty-${name}`);
            let currentQty = parseInt(qtySpan.innerText);
            let newQty = Math.max(0, currentQty + delta);
            
            if(newQty !== currentQty) {
                qtySpan.innerText = newQty;
                window.total += (delta * price);
                if(delta > 0) {
                    window.cart.push({ id: Date.now(), name, price });
                    showToast("✅ Adicionado!");
                } else {
                    const idx = window.cart.findLastIndex(i => i.name.includes(name)); // Busca por 'includes' para pegar itens com maionese
                    if(idx > -1) window.cart.splice(idx, 1);
                }
                updateDisplay();
            }
        };

        window.removeFromCart = (id, name, price) => {
            const idx = window.cart.findIndex(i => i.id === id);
            if(idx > -1) {
                const itemToRemove = window.cart[idx];
                window.cart.splice(idx, 1);
                window.total -= itemToRemove.price;
                
                // Atualiza contador no cardápio
                const baseName = hotDogs.some(dog => itemToRemove.name.includes(dog.nome)) 
                               ? hotDogs.find(dog => itemToRemove.name.includes(dog.nome)).nome
                               : itemToRemove.name;

                const qtySpan = document.getElementById(`qty-${baseName}`);
                if(qtySpan) qtySpan.innerText = Math.max(0, parseInt(qtySpan.innerText) - 1);
                
                updateDisplay();
                renderCartItems();
            }
        };

        function updateDisplay() {
            document.getElementById('total-price').innerText = window.total.toFixed(2).replace('.', ',');
        }

        window.toggleCartModal = () => {
            renderCartItems();
            document.getElementById('cart-modal').classList.toggle('hidden');
        };

        window.closeModals = () => {
            document.getElementById('modal-mayo').classList.add('hidden');
            document.getElementById('cart-modal').classList.add('hidden');
        };

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            if(window.cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-10 font-bold">Seu carrinho está vazio 😕</p>`;
                return;
            }
            container.innerHTML = window.cart.map(i => `
                <div class="flex justify-between items-center bg-gray-50 dark:bg-zinc-800 p-4 rounded-2xl shadow-sm border border-gray-100">
                    <div>
                        <p class="font-black text-sm">${i.name}</p>
                        <p class="text-green-600 font-bold text-xs">R$ ${i.price.toFixed(2).replace('.', ',')}</p>
                    </div>
                    <button onclick="removeFromCart(${i.id}, '${i.name}', ${i.price})" class="p-2 text-red-500 bg-red-50 rounded-xl">
                        🗑️
                    </button>
                </div>
            `).join('');
        }

        window.setMethod = (m) => {
            orderMethod = m;
            document.getElementById('btn-entrega').className = m === 'entrega' ? 'flex-1 py-3 rounded-xl font-black text-sm bg-white shadow dark:bg-zinc-700' : 'flex-1 py-3 rounded-xl font-black text-sm';
            document.getElementById('btn-retirada').className = m === 'retirada' ? 'flex-1 py-3 rounded-xl font-black text-sm bg-white shadow dark:bg-zinc-700' : 'flex-1 py-3 rounded-xl font-black text-sm';
            document.getElementById('address-fields').classList.toggle('hidden', m === 'retirada');
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }

        window.finalizarPedido = async () => {
            const btn = document.getElementById('btn-finalizar');
            const nome = document.getElementById('client-name').value;
            const endereco = document.getElementById('address').value;
            const obs = document.getElementById('obs').value;
            const pagamento = document.getElementById('payment').value;

            if(window.cart.length === 0) return alert("Seu carrinho está vazio!");
            if(!nome || (orderMethod === 'entrega' && !endereco)) return alert("Preencha os campos obrigatórios!");

            btn.disabled = true;
            btn.innerText = "⏳ ENVIANDO...";

            try {
                await addDoc(collection(db, "pedidos"), {
                    cliente: nome,
                    tipo: orderMethod,
                    endereco: orderMethod === 'entrega' ? endereco : 'RETIRADA NO LOCAL',
                    observacao: obs,
                    itens: window.cart.map(i => ({ name: i.name, price: i.price })), // Salva apenas nome e preço
                    total: window.total,
                    pagamento: pagamento,
                    status: "pendente",
                    data: serverTimestamp()
                });

                let msg = `*🌭 NOVO PEDIDO - CRIS PRADO*%0A`;
                msg += `----------------------------%0A`;
                msg += `📦 *TIPO:* ${orderMethod.toUpperCase()}%0A`;
                msg += `👤 *CLIENTE:* ${nome}%0A`;
                if(orderMethod === 'entrega') msg += `📍 *END:* ${endereco}%0A🏠 *OBS:* ${obs}%0A`;
                msg += `----------------------------%0A`;
                window.cart.forEach(i => msg += `• ${i.name} - R$ ${i.price.toFixed(2).replace('.', ',')}%0A`);
                msg += `----------------------------%0A`;
                msg += `💰 *TOTAL: R$ ${window.total.toFixed(2).replace('.', ',')}*%0A💳 *PAGAMENTO:* ${pagamento}`;

                window.open(`https://wa.me/5511999999999?text=${msg}`); // COLOQUE SEU NUMERO AQUI
                location.reload();
            } catch (e) {
                alert("Erro ao enviar pedido: " + e.message);
                console.error("Erro Firebase:", e);
                btn.disabled = false;
                btn.innerText = "Tentar Novamente";
            }
        };
    </script>
</body>
</html>
