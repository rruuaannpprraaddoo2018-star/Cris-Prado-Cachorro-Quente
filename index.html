<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cris Prado | Hot Dog Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Pacifico&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        h1 { font-family: 'Bangers', cursive; }
        .slogan { font-family: 'Pacifico', cursive; }
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: #f9fafb;
            background-image: url("https://www.transparenttextures.com/patterns/food.png");
            background-attachment: fixed;
        }
        .sidebar { transition: 0.4s; transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
        .product-img { width: 65px; height: 65px; object-fit: contain; }
    </style>
</head>
<body class="pb-32">

    <div id="sidebar" class="sidebar fixed inset-y-0 left-0 w-80 bg-white shadow-2xl z-[100] p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-red-600">MEUS PEDIDOS</h2>
            <button onclick="toggleSidebar()" class="text-3xl">&times;</button>
        </div>
        <input type="number" id="track-phone" placeholder="WhatsApp (só números)" class="w-full p-3 border-2 rounded-xl mb-3">
        <button onclick="buscarStatus()" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold mb-6">Consultar</button>
        <div id="status-result" class="space-y-3 overflow-y-auto max-h-[60vh]"></div>
    </div>
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-[90] hidden"></div>

    <header class="bg-red-600 text-white p-10 text-center shadow-xl border-b-4 border-yellow-400 relative">
        <button onclick="toggleSidebar()" class="absolute left-6 top-1/2 -translate-y-1/2 text-3xl">☰</button>
        <h1 class="text-6xl mb-2 italic text-yellow-100">Cris Prado</h1>
        <p class="slogan text-2xl text-yellow-200">O melhor hot dog da região!</p>
        <div id="status-loja" class="mt-4 inline-flex items-center gap-2 bg-black/30 px-5 py-2 rounded-full font-bold text-sm text-white">
            <span id="status-dot" class="w-3 h-3 rounded-full"></span>
            <span id="status-text">Carregando...</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-10">
        <section data-aos="fade-up">
            <h2 class="text-2xl font-black mb-6 text-red-700 border-b-4 border-red-100 pb-2">🌭 Nossos Dogs</h2>
            <div class="space-y-4" id="lista-dogs"></div>
        </section>

        <section data-aos="fade-up">
            <h2 class="text-2xl font-black mb-6 text-blue-700 border-b-4 border-blue-100 pb-2">🥤 Bebidas Geladas</h2>
            <div class="space-y-4" id="lista-bebidas"></div>
        </section>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white p-6 flex justify-between items-center shadow-[0_-10px_30px_rgba(0,0,0,0.1)] z-50 rounded-t-[32px]">
        <div>
            <p class="text-[10px] font-black text-gray-400 uppercase">Seu Total</p>
            <span class="text-3xl font-black text-red-600">R$ <span id="total-price">0,00</span></span>
        </div>
        <button onclick="toggleCartModal()" class="bg-red-600 text-white px-10 py-4 rounded-2xl font-black text-lg active:scale-95 transition">Carrinho 🛒</button>
    </div>

    <div id="modal-mayo" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-[120] p-4">
        <div class="bg-white w-full max-w-sm p-8 rounded-[40px] relative">
            <h3 id="modal-item-name" class="text-2xl font-black text-red-600 mb-4 italic">Personalizar</h3>
            <p class="font-bold mb-4">Escolha sua Maionese:</p>
            <select id="mayo-select" class="w-full p-4 border-2 rounded-2xl font-bold mb-6 bg-gray-50">
                <option value="Maionese Verde">Maionese Verde (Casa)</option>
                <option value="Maionese de Bacon">Maionese de Bacon</option>
                <option value="Cebola Caramelizada">Cebola Caramelizada</option>
                <option value="Sem Maionese">Sem Maionese</option>
            </select>
            <button onclick="confirmLanche()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black text-xl">Confirmar</button>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-[110] p-4">
        <div class="bg-white w-full max-w-md p-8 rounded-[40px] max-h-[90vh] overflow-y-auto relative">
            <button onclick="toggleCartModal()" class="absolute top-4 right-6 text-2xl font-bold">✕</button>
            <h2 class="text-3xl font-black mb-6">Finalizar Pedido</h2>
            <div id="cart-items" class="space-y-3 mb-6 border-b pb-6"></div>
            <div class="space-y-4">
                <input type="text" id="client-name" placeholder="Nome" class="w-full p-4 border-2 rounded-2xl font-bold">
                <input type="number" id="client-phone" placeholder="WhatsApp (DDD + Número)" class="w-full p-4 border-2 rounded-2xl font-bold border-blue-200">
                <input type="text" id="address" placeholder="Endereço e Número" class="w-full p-4 border-2 rounded-2xl font-bold">
                <select id="payment" class="w-full p-4 border-2 rounded-2xl font-bold">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
            <button id="btn-finalizar" onclick="finalizarPedido()" class="w-full bg-green-500 text-white py-5 rounded-2xl font-black text-xl mt-6">ENVIAR AGORA 📲</button>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFqUjWp4fBd_wl75uMmaGjRfJDS85FLe4",
            authDomain: "cris-prado.firebaseapp.com",
            projectId: "cris-prado",
            storageBucket: "cris-prado.firebasestorage.app",
            messagingSenderId: "316187175890",
            appId: "1:316187175890:web:72288256711dfad37fb60b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.cart = [];
        window.total = 0;
        let tempItem = null;

        const hotDogs = [
            { n: "Carne", p: 14.90 }, { n: "Frango", p: 14.90 }, { n: "Misto", p: 14.90 }
        ];

        const bebidas = [
            { n: "Coca-Cola 2L", p: 15.00, img: "https://im.ge/i/coca-2l.png" },
            { n: "Roller 2L", p: 10.00, img: "https://im.ge/i/roller-2l.png" },
            { n: "Cotuba 2L", p: 12.00, img: "https://im.ge/i/cotuba-2l.png" },
            { n: "Coca lata 350ml", p: 6.00, img: "https://im.ge/i/coca-lata.png" },
            { n: "Coca 600ml", p: 8.00, img: "https://im.ge/i/coca-600ml.png" },
            { n: "Cotuba 600ml", p: 7.00, img: "https://im.ge/i/cotuba-600ml.png" },
            { n: "Água sem gás 500ml", p: 4.00, img: "https://im.ge/i/agua-sem-gas.png" }
        ];

        window.onload = () => {
            AOS.init({ duration: 800 });
            renderMenu();
            checkStatus();
        };

        function renderMenu() {
            document.getElementById('lista-dogs').innerHTML = hotDogs.map(d => `
                <div class="bg-white p-5 rounded-[30px] shadow-sm flex justify-between items-center border">
                    <div class="flex-1"><h3 class="font-black text-xl">${d.n}</h3><p class="text-green-600 font-black">R$ ${d.p.toFixed(2)}</p></div>
                    <div class="flex items-center gap-4 bg-gray-100 p-2 rounded-2xl">
                        <button onclick="changeQty('${d.n}', ${d.p}, -1)" class="w-10 h-10 bg-white rounded-xl shadow font-bold text-red-500 text-xl">-</button>
                        <span id="qty-${d.n}" class="font-black text-xl">0</span>
                        <button onclick="openCustomization('${d.n}', ${d.p})" class="w-10 h-10 bg-red-600 text-white rounded-xl font-bold text-xl">+</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('lista-bebidas').innerHTML = bebidas.map(b => `
                <div class="bg-white p-4 rounded-[30px] shadow-sm flex justify-between items-center border">
                    <div class="flex-1"><h3 class="font-black text-lg">${b.n}</h3><p class="text-green-600 font-black">R$ ${b.p.toFixed(2)}</p>
                        <div class="flex items-center gap-3 bg-gray-100 p-1 w-fit rounded-xl mt-2">
                            <button onclick="changeQty('${b.n}', ${b.p}, -1)" class="w-8 h-8 bg-white rounded shadow text-red-500 font-bold">-</button>
                            <span id="qty-${b.n}" class="font-bold w-4 text-center">0</span>
                            <button onclick="changeQty('${b.n}', ${b.p}, 1)" class="w-8 h-8 bg-white rounded shadow text-green-600 font-bold">+</button>
                        </div>
                    </div>
                    <img src="${b.img}" class="product-img ml-2">
                </div>
            `).join('');
        }

        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('hidden');
        };

        window.buscarStatus = async () => {
            const tel = document.getElementById('track-phone').value;
            const res = document.getElementById('status-result');
            if(!tel) return alert("Digite seu número!");
            res.innerHTML = "Buscando...";
            
            const q = query(collection(db, "pedidos"), where("telefone", "==", tel));
            const snap = await getDocs(q);
            
            if(snap.empty) { res.innerHTML = "Nenhum pedido encontrado."; return; }
            res.innerHTML = "";
            snap.forEach(doc => {
                const p = doc.data();
                res.innerHTML += `<div class="bg-gray-50 p-4 rounded-2xl border"><b>#${doc.id.slice(-4)}</b> - <span class="uppercase text-red-600 font-black">${p.status}</span><br><small>${p.itens.length} itens</small></div>`;
            });
        };

        window.changeQty = (name, price, delta) => {
            const qtySpan = document.getElementById(`qty-${name}`);
            let current = parseInt(qtySpan.innerText);
            let next = Math.max(0, current + delta);
            if(next !== current) {
                qtySpan.innerText = next;
                window.total += (delta * price);
                if(delta > 0) window.cart.push({id: Date.now(), name, price});
                else { const idx = window.cart.findLastIndex(i => i.name.includes(name)); if(idx > -1) window.cart.splice(idx, 1); }
                document.getElementById('total-price').innerText = window.total.toFixed(2).replace('.', ',');
            }
        };

        window.openCustomization = (name, price) => { tempItem = { name, price }; document.getElementById('modal-mayo').classList.remove('hidden'); };
        
        window.confirmLanche = () => {
            const mayo = document.getElementById('mayo-select').value;
            window.cart.push({ id: Date.now(), name: `${tempItem.name} (${mayo})`, price: tempItem.price });
            window.total += tempItem.price;
            document.getElementById(`qty-${tempItem.name}`).innerText = parseInt(document.getElementById(`qty-${tempItem.name}`).innerText) + 1;
            document.getElementById('total-price').innerText = window.total.toFixed(2).replace('.', ',');
            document.getElementById('modal-mayo').classList.add('hidden');
        };

        window.toggleCartModal = () => {
            const container = document.getElementById('cart-items');
            container.innerHTML = window.cart.map(i => `<div class="flex justify-between text-sm font-bold"><span>${i.name}</span><span>R$ ${i.price.toFixed(2)}</span></div>`).join('');
            document.getElementById('cart-modal').classList.toggle('hidden');
        };

        window.checkStatus = () => {
            const hora = new Date().getHours();
            const dia = new Date().getDay();
            const aberto = (dia >= 2 && dia <= 6) && (hora >= 18 && hora < 23);
            document.getElementById('status-dot').className = `w-3 h-3 rounded-full ${aberto ? 'bg-green-400' : 'bg-red-500'}`;
            document.getElementById('status-text').innerText = aberto ? "ABERTO" : "FECHADO";
        };

        window.finalizarPedido = async () => {
            const nome = document.getElementById('client-name').value;
            const tel = document.getElementById('client-phone').value;
            const end = document.getElementById('address').value;
            if(!nome || !tel || !end || window.cart.length === 0) return alert("Preencha tudo!");

            await addDoc(collection(db, "pedidos"), {
                cliente: nome, telefone: tel, endereco: end,
                itens: window.cart, total: window.total,
                status: "pendente", data: serverTimestamp()
            });
            window.open(`https://wa.me/5511999999999?text=Novo Pedido de ${nome}`); // Ajuste o número
            location.reload();
        };
    </script>
</body>
</html>
