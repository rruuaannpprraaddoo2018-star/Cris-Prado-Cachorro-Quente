<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cris Prado | Gestão de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pedido-card { transition: all 0.3s ease; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-950 text-white p-4 md:p-8">
    
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-slate-800 pb-6">
        <div>
            <h1 class="text-3xl font-black text-yellow-400 tracking-tighter">COZINHA CRIS PRADO 🌭</h1>
            <p class="text-slate-500 text-sm font-bold uppercase tracking-widest">Gestão de Pedidos em Tempo Real</p>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="enableAudio()" id="btn-audio" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full text-xs font-black flex items-center gap-2 border border-slate-700 transition-all">
                <span id="audio-status">🔈 ATIVAR SOM</span>
            </button>
            <div class="flex items-center gap-2 bg-green-500/10 px-4 py-2 rounded-full border border-green-500/20">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span>
                <span class="text-green-500 font-black text-xs">LIVE</span>
            </div>
        </div>
    </header>

    <div id="lista-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

    <audio id="audio-alert" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFqUjWp4fBd_wl75uMmaGjRfJDS85FLe4",
            authDomain: "cris-prado.firebaseapp.com",
            projectId: "cris-prado",
            storageBucket: "cris-prado.firebasestorage.app",
            messagingSenderId: "316187175890",
            appId: "1:316187175890:web:72288256711dfad37fb60b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const audio = document.getElementById('audio-alert');
        let audioEnabled = false;

        window.enableAudio = () => {
            audioEnabled = true;
            document.getElementById('audio-status').innerText = "🔊 SOM ATIVADO";
            document.getElementById('btn-audio').classList.replace('bg-slate-800', 'bg-green-600');
            audio.play().then(() => audio.pause());
        };

        onSnapshot(query(collection(db, "pedidos"), orderBy("data", "desc")), (snap) => {
            const container = document.getElementById('lista-pedidos');
            
            snap.docChanges().forEach(change => {
                if (change.type === "added" && audioEnabled) {
                    audio.play().catch(e => console.log("Erro áudio"));
                }
            });

            container.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const status = (p.status || "Pendente").toLowerCase();
                const isConcluido = status === 'concluido';
                
                let botoesAcao = "";
                if (!isConcluido) {
                    if (status === 'pendente') {
                        botoesAcao = `<button onclick="updateStatus('${d.id}', 'Preparando')" class="col-span-2 bg-blue-600 p-3 rounded-xl font-black text-[10px] uppercase">Preparar 👨‍🍳</button>`;
                    } else if (status === 'preparando') {
                        if (p.metodo === 'entrega') {
                            botoesAcao = `<button onclick="updateStatus('${d.id}', 'Saiu para Entrega')" class="col-span-2 bg-orange-600 p-3 rounded-xl font-black text-[10px] uppercase animate-bounce">Enviar Motoboy 🛵</button>`;
                        } else {
                            botoesAcao = `<button onclick="updateStatus('${d.id}', 'Pronto para Retirada')" class="col-span-2 bg-purple-600 p-3 rounded-xl font-black text-[10px] uppercase animate-bounce">Avisar p/ Buscar 🛍️</button>`;
                        }
                    } else {
                        botoesAcao = `<button onclick="updateStatus('${d.id}', 'Concluido')" class="col-span-2 bg-green-600 p-3 rounded-xl font-black text-[10px] uppercase">Finalizar ✅</button>`;
                    }
                } else {
                    botoesAcao = `<button onclick="arquivar('${d.id}')" class="col-span-2 bg-slate-800 p-3 rounded-xl font-black text-[10px] uppercase opacity-50">Remover</button>`;
                }

                const card = document.createElement('div');
                card.className = `pedido-card p-5 rounded-3xl border-2 transition-all bg-slate-900 ${status === 'preparando' ? 'border-blue-500' : isConcluido ? 'opacity-50 border-slate-800' : 'border-yellow-500/50'}`;
                card.innerHTML = `
                    <div class="flex justify-between mb-4">
                        <span class="text-[10px] font-black bg-white/10 px-2 py-1 rounded-lg text-slate-400">#${d.id.slice(-4).toUpperCase()}</span>
                        <span class="px-2 py-1 rounded-full text-[10px] font-black uppercase bg-white/10">${status}</span>
                    </div>
                    <h3 class="text-xl font-black uppercase">${p.cliente}</h3>
                    <p class="text-xs font-bold text-green-400 mb-4">${p.telefone}</p>
                    <div class="bg-black/40 p-3 rounded-2xl mb-4 text-sm">
                        ${p.itens.map(i => `<p class="border-b border-white/5 py-1"><b>${i.name}</b></p>`).join('')}
                    </div>
                    <p class="text-[11px] text-slate-400 mb-4 leading-tight">📍 ${p.endereco}<br>💳 ${p.pagamento} (${p.metodo})</p>
                    <div class="flex justify-between items-center mb-4 border-t border-white/10 pt-4">
                        <span class="text-2xl font-black text-green-400">R$ ${p.total.toFixed(2)}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">${botoesAcao}</div>
                `;
                container.appendChild(card);
            });
        });

        window.updateStatus = async (id, status) => { await updateDoc(doc(db, "pedidos", id), { status }); };
        window.arquivar = async (id) => { if(confirm("Remover?")) await deleteDoc(doc(db, "pedidos", id)); };
    </script>
</body>
</html>
