<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cris Prado | Gestão PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pedido-card { transition: all 0.3s ease; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
    </style>
</head>
<body class="bg-slate-950 text-white p-4 md:p-8">
    
    <header class="flex flex-col md:flex-row justify-between items-start mb-8 gap-6 border-b border-slate-800 pb-8">
        <div>
            <h1 class="text-4xl font-black text-yellow-400 tracking-tighter">COZINHA CRIS PRADO 🌭</h1>
            <p class="text-slate-500 text-xs font-black uppercase tracking-widest">Painel de Controle em Tempo Real</p>
        </div>
        
        <div class="flex flex-wrap gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-[20px] min-w-[140px]">
                <p class="text-slate-500 text-[10px] font-black uppercase">Vendas Hoje</p>
                <p class="text-2xl font-black text-green-400">R$ <span id="faturamento">0,00</span></p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-[20px] min-w-[100px]">
                <p class="text-slate-500 text-[10px] font-black uppercase">Pedidos</p>
                <p class="text-2xl font-black text-blue-400" id="count">0</p>
            </div>
            <button onclick="enableAudio()" id="btn-audio" class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded-2xl text-[10px] font-black transition-all">
                <span id="audio-status">🔈 LIGAR ALERTA</span>
            </button>
        </div>
    </header>

    <div class="flex justify-between items-center mb-6">
        <h2 class="text-slate-400 font-black text-sm uppercase tracking-tighter">Fila de Produção</h2>
        <button onclick="limparConcluidos()" class="text-[10px] font-black text-slate-600 hover:text-white uppercase">Limpar Concluídos</button>
    </div>

    <div id="lista-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

    <audio id="audio-alert" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFqUjWp4fBd_wl75uMmaGjRfJDS85FLe4",
            authDomain: "cris-prado.firebaseapp.com",
            projectId: "cris-prado",
            storageBucket: "cris-prado.firebasestorage.app",
            messagingSenderId: "316187175890",
            appId: "1:316187175890:web:72288256711dfad37fb60b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const audio = document.getElementById('audio-alert');
        let audioEnabled = false;

        window.enableAudio = () => {
            audioEnabled = true;
            document.getElementById('audio-status').innerText = "🔊 SOM LIGADO";
            document.getElementById('btn-audio').classList.replace('bg-red-600', 'bg-green-600');
            audio.play().then(() => audio.pause());
        };

        onSnapshot(query(collection(db, "pedidos"), orderBy("data", "desc")), (snap) => {
            const container = document.getElementById('lista-pedidos');
            let totalF = 0;
            let totalP = 0;

            snap.docChanges().forEach(change => {
                if (change.type === "added" && audioEnabled) audio.play();
            });

            container.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const status = (p.status || "Pendente").toLowerCase();
                if(status !== 'arquivado') {
                    totalF += p.total || 0;
                    totalP++;
                }

                let border = "border-slate-800";
                let btnAcao = "";
                let statusLabel = `<span class="bg-slate-800 text-slate-400 px-2 py-1 rounded text-[10px] font-black uppercase">${status}</span>`;

                if(status === 'pendente') {
                    border = "border-yellow-500 shadow-lg shadow-yellow-900/10";
                    btnAcao = `<button onclick="updateStatus('${d.id}', 'Preparando')" class="w-full bg-blue-600 p-4 rounded-2xl font-black text-xs uppercase">Aceitar Pedido 👨‍🍳</button>`;
                } else if(status === 'preparando') {
                    border = "border-blue-500 shadow-lg shadow-blue-900/10";
                    if(p.metodo === 'entrega') {
                        btnAcao = `<button onclick="updateStatus('${d.id}', 'Saiu para Entrega')" class="w-full bg-orange-600 p-4 rounded-2xl font-black text-xs uppercase blink">Despachar 🛵</button>`;
                    } else {
                        btnAcao = `<button onclick="updateStatus('${d.id}', 'Pronto para Retirada')" class="w-full bg-purple-600 p-4 rounded-2xl font-black text-xs uppercase">Pronto 🛍️</button>`;
                    }
                } else if(status === 'saiu para entrega' || status === 'pronto para retirada') {
                    border = "border-green-500 shadow-lg shadow-green-900/10";
                    btnAcao = `<button onclick="updateStatus('${d.id}', 'Concluido')" class="w-full bg-green-600 p-4 rounded-2xl font-black text-xs uppercase">Concluir ✅</button>`;
                } else if(status === 'concluido') {
                    border = "border-slate-900 opacity-40";
                    btnAcao = `<button onclick="remover('${d.id}')" class="w-full bg-slate-800 p-2 rounded-xl font-black text-[10px] uppercase">Arquivar</button>`;
                }

                const hora = p.data?.toDate ? p.data.toDate().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '--:--';

                const card = document.createElement('div');
                card.className = `pedido-card p-6 rounded-[32px] border-2 bg-slate-900/50 ${border}`;
                card.innerHTML = `
                    <div class="flex justify-between mb-4">
                        <span class="text-[10px] font-black text-slate-500">ID #${d.id.slice(-4).toUpperCase()} • ${hora}</span>
                        ${statusLabel}
                    </div>
                    <h3 class="text-2xl font-black uppercase">${p.cliente}</h3>
                    <a href="https://wa.me/55${p.telefone}" target="_blank" class="text-xs font-bold text-green-500">📱 ${p.telefone}</a>
                    
                    <div class="my-4 bg-black/30 p-4 rounded-2xl border border-white/5 space-y-2">
                        ${p.itens.map(i => `<p class="text-sm font-bold text-slate-200 flex justify-between"><span>1x ${i.name}</span> <span class="text-slate-500">R$ ${i.price.toFixed(2)}</span></p>`).join('')}
                    </div>

                    <div class="text-[10px] text-slate-400 space-y-1 mb-6">
                        <p>📍 ${p.endereco}</p>
                        <p>💳 <span class="font-black text-white">${p.pagamento} (${p.metodo})</span></p>
                    </div>

                    <div class="flex justify-between items-center mb-6">
                        <span class="text-3xl font-black text-green-400">R$ ${p.total.toFixed(2)}</span>
                    </div>

                    ${btnAcao}
                `;
                container.appendChild(card);
            });

            document.getElementById('faturamento').innerText = totalF.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('count').innerText = totalP;
        });

        window.updateStatus = async (id, status) => { await updateDoc(doc(db, "pedidos", id), { status }); };
        window.remover = async (id) => { if(confirm("Arquivar?")) await deleteDoc(doc(db, "pedidos", id)); };
        
        window.limparConcluidos = async () => {
            if(confirm("Remover todos os finalizados?")) {
                const q = query(collection(db, "pedidos"), where("status", "==", "Concluido"));
                onSnapshot(q, (snap) => snap.forEach(async (d) => await deleteDoc(doc(db, "pedidos", d.id))));
            }
        };
    </script>
</body>
</html>
